<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Heresies Quiz</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: radial-gradient(ellipse at center, #111118 0%, #050508 100%);
      color: #c9c9c9;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #0e0e16;
      padding: 1.5rem 1.25rem;
      padding-top: calc(1.5rem + env(safe-area-inset-top));
      padding-bottom: calc(1.5rem + env(safe-area-inset-bottom));
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.6);
      border: 1px solid #1a1a2a;
      position: relative;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      text-align: center;
      color: #8b0000;
      text-shadow: 0 0 12px rgba(139, 0, 0, 0.5);
    }

    .home-link {
      position: absolute;
      top: calc(1rem + env(safe-area-inset-top));
      left: 1rem;
      font-size: 0.8rem;
      letter-spacing: 0.05em;
      color: #555;
      text-decoration: none;
      padding: 0.3rem 0.5rem;
      border: 1px solid #1e1e30;
      border-radius: 4px;
      transition: color 0.2s, border-color 0.2s;
    }

    .home-link:active {
      color: #8b0000;
      border-color: #8b0000;
    }

    #question {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      padding: 1.25rem 1rem;
      background: #0a0a14;
      border-radius: 4px;
      border: 1px solid #1e1e30;
      min-height: 3.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.4;
      color: #d4d4d4;
    }

    .bible-link {
      display: block;
      text-align: center;
      margin-bottom: 0.75rem;
      padding: 0.6rem;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: #c9a84c;
      text-decoration: none;
      border: 2px solid #c9a84c;
      border-radius: 4px;
      background: rgba(201, 168, 76, 0.08);
      transition: background 0.2s, box-shadow 0.2s;
    }

    .bible-link:active {
      background: rgba(201, 168, 76, 0.2);
      box-shadow: 0 0 10px rgba(201, 168, 76, 0.3);
    }

    .input-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .input-group {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .input-group label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #666;
    }

    input {
      width: 100%;
      padding: 0.85rem 0.75rem;
      border: 2px solid #1e1e30;
      border-radius: 4px;
      background: #0a0a14;
      color: #e0e0e0;
      font-size: 1.15rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      text-align: center;
    }

    input:focus {
      border-color: #8b0000;
      box-shadow: 0 0 8px rgba(139, 0, 0, 0.3);
    }

    input:disabled {
      opacity: 0.4;
    }

    input::placeholder {
      color: #444;
    }

    #check {
      display: block;
      width: 100%;
      margin-top: 0.75rem;
      padding: 1rem;
      border: none;
      border-radius: 4px;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.05em;
      background: #8b0000;
      color: #f0f0f0;
      transition: background 0.2s, box-shadow 0.2s;
    }

    #check:active {
      background: #a50000;
      box-shadow: 0 0 12px rgba(139, 0, 0, 0.4);
    }

    #refresh {
      display: none;
      margin: 0.75rem auto 0;
      padding: 1rem 1.5rem;
      border: none;
      border-radius: 4px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.05em;
      background: #2a2a3a;
      color: #c0c0c0;
    }

    #refresh:active {
      background: #3a3a4a;
    }

    #output {
      margin-top: 1rem;
      text-align: center;
      font-size: 1.2rem;
      font-weight: 600;
      min-height: 1.75rem;
      letter-spacing: 0.03em;
    }

    #output.correct {
      color: #2a6a4a;
      text-shadow: 0 0 8px rgba(42, 106, 74, 0.4);
    }

    #output.wrong {
      color: #cc2222;
      text-shadow: 0 0 8px rgba(204, 34, 34, 0.4);
    }
  </style>
</head>
<body>
  <div class="card">
    <a href="index.html" class="home-link">Back</a>
    <h1>DEFEND THE FAITH:</h1>
    <div id="question">Loading…</div>
    <a href="htps://www.bible.com/bible/111" target="_blank" class="bible-link">Prove him wrong</a>
    <div class="input-row">
      <div class="input-group">
        <label>Book</label>
        <input type="text" id="book" placeholder="Book" autocomplete="off" />
      </div>
      <div class="input-group">
        <label>Chapter</label>
        <input type="number" id="chapter" placeholder="Ch" inputmode="numeric" />
      </div>
      <div class="input-group">
        <label>Verse</label>
        <input type="number" id="verse" placeholder="V" inputmode="numeric" />
      </div>
    </div>

    <button id="check">Check</button>
    <p id="output"></p>
    <button id="refresh">Another heresy?</button>
  </div>

  <script>

    const lines = null;

    function init(data) {
      const headerIndices = [];
      data.forEach((line, i) => {
        if (line.startsWith("@@")) headerIndices.push(i);
      });

      if (headerIndices.length === 0) {
        document.getElementById("question").innerText = "Error: no sections found.";
        return;
      }

      const randomIdx = headerIndices[Math.floor(Math.random() * headerIndices.length)];
      const laterHeaders = headerIndices.filter(i => i > randomIdx);
      const nextIdx = laterHeaders.length > 0 ? laterHeaders[0] : data.length;

      const header = data[randomIdx].replace(/^@@\s*/, "");
      const section = data.slice(randomIdx + 1, nextIdx);

      document.getElementById("question").innerText = header;

      const output   = document.getElementById("output");
      const bookIn   = document.getElementById("book");
      const chapIn   = document.getElementById("chapter");
      const verseIn  = document.getElementById("verse");
      const checkBtn = document.getElementById("check");
      const refreshBtn = document.getElementById("refresh");

      function check() {
        const book = bookIn.value.trim();
        const chap = chapIn.value.trim();
        const verse = verseIn.value.trim();

        if (!book || !chap || !verse) return;

        // Try multiple common formats for matching
        const candidates = [
          `${book} ${chap}:${verse}`,
          `${book} ${chap} ${verse}`,
          `${book} ${chap}:${verse}`,
          `${book.toLowerCase()} ${chap}:${verse}`,
          `${book.toLowerCase()} ${chap} ${verse}`
        ];

        const isCorrect = candidates.some(c =>
          section.some(line => line.includes(c))
        );

        if (isCorrect) {
          output.innerText = "Faith Defended.";
          output.className = "correct";
          bookIn.disabled = chapIn.disabled = verseIn.disabled = true;
          checkBtn.style.display = "none";
          refreshBtn.style.display = "block";
        } else {
          output.innerText = "Incorrect. Try again.";
          output.className = "wrong";
          bookIn.value = chapIn.value = verseIn.value = "";
          bookIn.focus();
        }
      }

      checkBtn.addEventListener("click", check);
      [bookIn, chapIn, verseIn].forEach(el => {
        el.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
      });
      refreshBtn.addEventListener("click", () => location.reload());

      bookIn.focus();
    }

    // Load data: prefer inline, fall back to fetch
    if (lines) {
      init(lines);
    } else {
      fetch("heresies.json")
        .then(res => {
          if (!res.ok) throw new Error(res.status);
          return res.json();
        })
        .then(init)
        .catch(err => {
          document.getElementById("question").innerText =
            "Failed to load data.\nServe over HTTP or embed data inline.";
          console.error(err);
        });
    }
  </script>
</body>
</html>
